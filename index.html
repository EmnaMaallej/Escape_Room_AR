<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#0a0612" />
    <meta name="description" content="Immersive VR Escape Room Game" />
    <title>Mysterious Room VR</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <!-- User Requested CDN (Import Map) -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
    </script>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
      }

      #exit-vr-btn {
          position: fixed;
          top: 20px;
          right: 20px;
          padding: 12px 24px;
          background: rgba(200, 0, 0, 0.8);
          color: white;
          border: 2px solid #ff4444;
          border-radius: 8px;
          font-family: 'Georgia', serif;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          z-index: 9999;
          display: none; /* Hidden by default, shown when usage allows */
          text-transform: uppercase;
          box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      }

      #exit-vr-btn:hover {
          background: rgba(255, 0, 0, 0.9);
          box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
      }
    </style>
  </head>

  <body>
    <div id="overlay-container" style="position: absolute; top:0; left:0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;">
        <button id="exit-vr-btn" style="pointer-events: auto;">Exit VR Mode</button>
    </div>
    <script type="module" src="/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered: ", registration);
            })
            .catch((registrationError) => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      }
    </script>
  </body>
</html>
